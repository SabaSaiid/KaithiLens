version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8844:8000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./datasets:/app/datasets

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "5199:80"
    depends_on:
      - backend
